services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: keep
      POSTGRES_PASSWORD: keep
      POSTGRES_DB: keep
    volumes:
      - keep_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keep -d keep"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: kaushal.joshi@amadeus.io
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://keep:keep@db:5432/keep
    ports:
      - "3005:3005"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - keep

volumes:
  keep_pgdata:

networks:
  keep:
    external: true
